[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crystalatlas"
version = "0.1.0a1"
description = "Proof-driven crystal structure prediction and de-novo generation"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
ml = [
  "torch>=2.4",
]
crystallography = [
  "spglib==2.7.0",
]
hpc = [
  "h5py>=3.11",
  "safetensors>=0.4",
  "scipy>=1.13",
]
dev = [
  "hypothesis>=6.100",
  "mypy==1.20.2",
  # NumPy 2.5 ships PEP-695 stubs that cannot be parsed when mypy checks the
  # package's supported Python-3.11 surface.  This is a verifier constraint;
  # the runtime dependency above intentionally remains uncapped.
  "numpy<2.5",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff==0.16.4",
]
all = [
  "torch>=2.4",
  "spglib==2.7.0",
  "h5py>=3.11",
  "safetensors>=0.4",
  "scipy>=1.13",
  "hypothesis>=6.100",
  "mypy==1.20.2",
  "numpy<2.5",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff==0.16.4",
]

[project.scripts]
crystalatlas = "crystalatlas.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crystalatlas = ["_data/spglib_v2_7_0/*"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "ml: tests requiring the optional PyTorch stack",
]
